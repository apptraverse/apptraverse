name: Apply and validate window catalog cleanup

on:
  push:
    branches: [cursor/surfaces-library-controls]
    paths: ['.github/workflows/window-catalog-cleanup-once.yml']

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Preserve source newlines
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Apply checksum-verified reviewed patch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          blobs = [
              '64b422324942bcb9bf85a11f21e726ccf5adbd5f',
              '1d45dd47d511e979194ea92800f2a3f1afcbdf13',
              '4a3d768da25a0f3f96caf341f18bb0ea509f4310',
              'd9aa6fffd47fdaa60a8e2c9003381ebcbcf5b771',
              '67fad1deb8b5d196b2d757e610744b798931d197',
              '54693eaa3e4a797e7df445f32c9a6453f07ba3ca',
          ]
          parts = []
          for sha in blobs:
              url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'window-catalog-validation',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              parts.append(base64.b64decode(blob['content']).decode('ascii'))
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '41fdae1ca5bfa97947599b54d6228e1ce9c13960de00d17325e4d929922669af'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'window-catalog.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          workflow = pathlib.Path('.github/workflows/window-catalog-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          assert text.count('-DBUILD_TESTING=ON') == 1
          text = text.replace('-DBUILD_TESTING=ON', '-DBUILD_TESTING=ON "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe"')
          workflow.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'add', str(workflow)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
      - name: Configure MinSizeRel
        run: cmake -S . -B build/MinSizeRel -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=ON -DCPM_SOURCE_CACHE=${{ github.workspace }}/build/cpm.cache "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe"
      - name: Build MinSizeRel
        run: cmake --build build/MinSizeRel --parallel 2
      - name: Test MinSizeRel
        run: ctest --test-dir build/MinSizeRel --output-on-failure --timeout 180
      - name: Configure Release
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCPM_SOURCE_CACHE=${{ github.workspace }}/build/cpm.cache "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe"
      - name: Build Release
        run: cmake --build build/Release --parallel 2
      - name: Test Release
        run: ctest --test-dir build/Release --output-on-failure --timeout 180
      - name: Record results and publish only if branch is unchanged
        shell: python
        run: |
          import os, pathlib, subprocess
          branch = 'cursor/surfaces-library-controls'
          head = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/' + branch], text=True).split()[0]
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch moved during validation; refusing to overwrite newer work')
          progress = pathlib.Path('Progress.md')
          note = '\n- Windows CI validation: Release and MinSizeRel configure/build/CTest passed (all six focused tests in each configuration). Run: ' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n'
          for config in ('Release', 'MinSizeRel'):
              for name in ('win32_window_catalog_demo', 'win32_window_catalog_demo_load_only'):
                  path = pathlib.Path('build') / config / 'examples/surfaces_demo/windows' / (name + '.exe')
                  note += '- ' + config + ' ' + name + '.exe: ' + str(path.stat().st_size) + ' bytes.\n'
          progress.write_text(progress.read_text(encoding='utf-8') + note, encoding='utf-8')
          subprocess.run(['git', 'add', 'Progress.md'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/window-catalog-cleanup-once.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Keep window catalog only; use v0 schemas, no exceptions and instance input routing'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-catalog-cleanup-validation
          path: |
            build/*/Testing/Temporary/*.log
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/examples/surfaces_demo/windows/*.exe
            build/*/examples/surfaces_demo/windows/*.map
          if-no-files-found: ignore
          retention-days: 3
