plugins { id 'com.android.application' }
def pushEnabled = (project.findProperty('chatPush') ?: 'false').toBoolean()
def pushServiceUid = (project.findProperty('pushServiceUid') ?: '') as String
if(pushEnabled && !(pushServiceUid ==~ /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/)) throw new GradleException('Set -PpushServiceUid to the service Aether UID')
if(pushEnabled) apply plugin: 'com.google.gms.google-services'

android {
  namespace 'com.apptraverse.sharedchat'
  buildFeatures { buildConfig true }
  sourceSets.main.java.srcDirs += [pushEnabled ? 'src/push/java' : 'src/noPush/java', '../../../../src/platform/android/java']
  if(pushEnabled) sourceSets.main.manifest.srcFile 'src/push/MergedManifest.xml'
  compileSdk 34
  buildToolsVersion '36.0.0'
  ndkVersion '29.0.14206865'
  defaultConfig {
    applicationId 'com.apptraverse.sharedchat'
    minSdk 24
    targetSdk 34
    testInstrumentationRunner 'com.apptraverse.sharedchat.GenericChatInstrumentation'
    buildConfigField 'String', 'PUSH_SERVICE_UID', '"'+pushServiceUid+'"'
    versionCode 1
    versionName '1.0'
    ndk { abiFilters 'x86_64' }
    externalNativeBuild.cmake {
      arguments '-DANDROID_STL=c++_static'
      if(project.findProperty('apptraverse.cmakeInitialCache')) arguments "-DAPPTRAVERSE_CMAKE_INITIAL_CACHE=${project.property('apptraverse.cmakeInitialCache')}"
      targets 'shared_chat_android'
    }
  }
  externalNativeBuild.cmake { path file('../native/CMakeLists.txt'); version '4.1.2' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes {
    debug { debuggable true; jniDebuggable true }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      externalNativeBuild.cmake.arguments '-DAPPTRAVERSE_MINIMUM_64=ON'
    }
  }
}

if(pushEnabled) { dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' } }
