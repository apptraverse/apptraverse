org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true

# One CMake configure at a time. Two concurrent per-ABI configures of the aether
# dependency tree intermittently fail in the c-ares symbol checks with
# "CMAKE_C_COMPILER not set, after EnableLanguage". Ninja still compiles the
# native sources in parallel inside each ABI.
org.gradle.parallel=false
org.gradle.workers.max=1

# Plain framework widgets only, no AndroidX, no Compose.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

# Overridable from the command line, for example:
#   gradlew.bat -Papptraverse.abiFilters=x86_64 :app:assembleDebug
apptraverse.abiFilters=x86_64,arm64-v8a
apptraverse.compileSdk=34
apptraverse.cmakeVersion=4.1.2
