plugins {
  id "com.android.application"
}

def compileSdkVersion = (project.findProperty("apptraverse.compileSdk") ?: "34") as Integer
def cmakeVersion = project.findProperty("apptraverse.cmakeVersion") ?: "4.1.2"
def cmakeInitialCache = project.findProperty("apptraverse.cmakeInitialCache")
def abiFilterList = ((project.findProperty("apptraverse.abiFilters") ?: "x86_64") as String)
    .split(",")
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

android {
  namespace "com.apptraverse.windowcatalog"
  compileSdk compileSdkVersion
  buildToolsVersion = "36.0.0"
  ndkVersion "29.0.14206865"

  defaultConfig {
    applicationId "com.apptraverse.windowcatalog"
    minSdk 24
    targetSdk compileSdkVersion
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    testInstrumentationRunnerArguments debugFresh:
        ((project.findProperty("apptraverse.testBuildType") ?: "debug") != "debugLoadOnly").toString()

    ndk {
      abiFilters.addAll(abiFilterList)
    }

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_static",
                  "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
        if (cmakeInitialCache) {
          arguments "-DAPPTRAVERSE_CMAKE_INITIAL_CACHE=${cmakeInitialCache}"
        }
        targets "apptraverse_window_catalog_jni"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path file("../native/CMakeLists.txt")
      version cmakeVersion
    }
  }

  sourceSets {
    main {
      java.srcDirs += ["../../../../src/platform/android/java"]
    }
    debugLoadOnly.manifest.srcFile "src/debug/AndroidManifest.xml"
  }

  testBuildType project.findProperty("apptraverse.testBuildType") ?: "debug"

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  def releaseKeystore = file("${rootDir}/.local/release-test.keystore")
  if (releaseKeystore.exists()) {
    signingConfigs {
      release {
        storeFile releaseKeystore
        storePassword "android"
        keyAlias "release-test"
        keyPassword "android"
      }
    }
  }

  buildTypes {
    debug {
      debuggable true
      jniDebuggable true
      externalNativeBuild.cmake.arguments "-DAPPTRAVERSE_WINDOW_CATALOG_DEBUG_FRESH=ON"
    }
    debugLoadOnly {
      initWith debug
      matchingFallbacks = ["debug"]
      externalNativeBuild.cmake.arguments "-DAPPTRAVERSE_WINDOW_CATALOG_DEBUG_FRESH=OFF"
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
      if (releaseKeystore.exists()) {
        signingConfig signingConfigs.release
      }
    }
    minSizeRel {
      initWith release
      matchingFallbacks = ["release"]
      signingConfig signingConfigs.debug
      minifyEnabled true
      externalNativeBuild.cmake.arguments "-DCMAKE_BUILD_TYPE=MinSizeRel",
          "-DAPPTRAVERSE_WINDOW_CATALOG_DEBUG_FRESH=OFF",
          "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON",
          "-DCMAKE_C_FLAGS_MINSIZEREL=-Oz -DNDEBUG -ffunction-sections -fdata-sections",
          "-DCMAKE_CXX_FLAGS_MINSIZEREL=-Oz -DNDEBUG -ffunction-sections -fdata-sections",
          "-DCMAKE_SHARED_LINKER_FLAGS_MINSIZEREL=-flto=thin -Wl,--gc-sections,--strip-all"
    }
  }

  lint {
    abortOnError false
  }
}

dependencies {
  androidTestImplementation "androidx.test:runner:1.6.1"
  androidTestImplementation "androidx.test:rules:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
