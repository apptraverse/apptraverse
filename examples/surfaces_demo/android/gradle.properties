org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true

# One CMake configure at a time: concurrent per-ABI configures of the aether
# dependency tree intermittently fail. Ninja still compiles in parallel.
org.gradle.parallel=false
org.gradle.workers.max=1

# Plain framework widgets only, no AndroidX, no Compose.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

# Overridable from the command line, for example:
#   gradlew.bat -Papptraverse.abiFilters=arm64-v8a :app:assembleDebug
apptraverse.abiFilters=x86_64
apptraverse.compileSdk=34
apptraverse.cmakeVersion=4.1.2
