<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppTraverse WindowCatalog</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      color: #111;
      background: #f7f7f7;
    }
    #catalog-panel {
      max-width: 720px;
      padding: 16px;
      background: #fff;
      border: 1px solid #ccc;
    }
    #catalog-title {
      margin: 0 0 12px;
      font-size: 22px;
    }
    #catalog-list {
      min-height: 120px;
      margin: 0 0 16px;
      padding: 8px 24px;
      border: 1px solid #ddd;
      background: #fafafa;
    }
    #catalog-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button.catalog-button {
      padding: 8px 14px;
      border: 1px solid #888;
      background: #e8e8e8;
      cursor: default;
    }
    button.catalog-button:disabled {
      opacity: 0.55;
    }
    #status { margin-top: 16px; color: #444; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>WindowCatalog (Web)</h1>
  <div id="catalog-panel">
    <h2 id="catalog-title">Loading…</h2>
    <ul id="catalog-list"></ul>
    <div id="catalog-buttons"></div>
  </div>
  <div id="status"></div>

  <script>
    var Module = {
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      preRun: [function() {
        if (!crossOriginIsolated) {
          throw new Error('crossOriginIsolated is false; serve with COOP/COEP');
        }
        if (typeof SharedArrayBuffer === 'undefined') {
          throw new Error('SharedArrayBuffer unavailable');
        }
        FS.mkdir('/persistent');
        FS.mount(IDBFS, {}, '/persistent');
        Module['addRunDependency']('idbfs-sync');
        FS.syncfs(true, function(err) {
          if (err) {
            console.error('IDBFS syncfs(true) failed', err);
            document.getElementById('status').textContent =
                'IndexedDB load failed: ' + err;
          } else {
            console.log('WINDOW_CATALOG_IDBFS_LOADED');
          }
          Module['removeRunDependency']('idbfs-sync');
        });
      }],
      onRuntimeInitialized: function() {
        console.log('WINDOW_CATALOG_WASM_READY crossOriginIsolated=' + crossOriginIsolated);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
