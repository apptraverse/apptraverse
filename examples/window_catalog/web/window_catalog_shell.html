<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AppTraverse WindowCatalog</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, sans-serif;
      color: var(--at-text, CanvasText);
      background: var(--at-background, Canvas);
      overscroll-behavior: none;
    }
    html { color-scheme: light dark; }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 960px;
      margin: 0 auto;
      background: var(--at-background, Canvas);
    }
    /* Pager header: title + page indicator + prev/next + application Close. */
    #pager-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #ccc;
      background: var(--at-background, Canvas);
    }
    #pager-bar[hidden] { display: none; }
    #page-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 600;
    }
    #page-indicator { color: GrayText; font-size: 14px; white-space: nowrap; }
    #pager-bar button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid #888;
      background: ButtonFace;
      color: ButtonText;
      font-size: 16px;
    }
    #pager-bar button:disabled { opacity: 0.5; }

    /* The UI mirror mounts one .apptraverse-desktop-window per catalog window.
       Its inline geometry is the desktop frame; the pager makes every window a
       full-viewport page and shows only the active one. */
    #catalog-mount {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      touch-action: pan-y;
    }
    #catalog-mount .apptraverse-desktop-window {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: none;
      box-sizing: border-box;
      background: var(--at-background, Canvas);
      color: var(--at-text, CanvasText);
      overflow: auto;
    }
    #catalog-mount .apptraverse-desktop-window.page-active { display: block; }
    #catalog-mount .apptraverse-desktop-client {
      position: relative;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box;
    }
    .apptraverse-push-button {
      box-sizing: border-box;
      font: inherit;
      padding: 6px 12px;
      white-space: normal;
      border: 1px solid ButtonBorder;
      background: ButtonFace;
      color: ButtonText;
      touch-action: manipulation;
    }
    .apptraverse-push-button:disabled { opacity: 0.55; }
    .apptraverse-list {
      box-sizing: border-box;
      border: 1px solid #ccc;
      background: var(--at-background, Canvas);
      -webkit-overflow-scrolling: touch;
    }
    .apptraverse-list-row {
      padding: 12px 10px;
      min-height: 20px;
      cursor: default;
      user-select: none;
      border-bottom: 1px solid GrayText;
    }
    .apptraverse-list-row-selected { background: Highlight; color: HighlightText; }

    #page-dots { display: flex; justify-content: center; gap: 6px; padding: 6px; }
    #page-dots button {
      width: 14px;
      height: 14px;
      padding: 0;
      border: 1px solid #888;
      border-radius: 50%;
      background: ButtonFace;
    }
    #page-dots button.dot-active { background: #2563eb; border-color: #2563eb; }
    #application-menu { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 12px; }
    #application-menu label { display: flex; align-items: center; gap: 6px; }
    #application-menu select { font: inherit; min-height: 36px; }
    #layout-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 12px; }
    #layout-actions[hidden] { display: none; }
    #layout-actions button { font: inherit; min-height: 36px; }
    #app.page-fullscreen #catalog-mount {
      position: fixed; inset: var(--fullscreen-toolbar-height, 0px) 0 0; z-index: 10;
    }
    #app.page-fullscreen #pager-bar {
      position: fixed; right: 0; top: 0; z-index: 20;
      width: 100%; box-sizing: border-box; flex-wrap: wrap;
    }
    #app.page-fullscreen #application-menu,
    #app.page-fullscreen #layout-actions,
    #app.page-fullscreen #page-dots,
    #app.page-fullscreen #status,
    #app.page-fullscreen #page-indicator { display: none; }
    #status { padding: 4px 12px 8px; color: GrayText; min-height: 1.2em; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="pager-bar" hidden>
      <button id="prev-page" disabled type="button">&#9664;</button>
      <div id="page-title">AppTraverse</div>
      <div id="page-indicator"></div>
      <button id="next-page" disabled type="button">&#9654;</button>
      <button id="fullscreen-button" disabled type="button"></button>
      <button id="shutdown-button" disabled type="button"></button>
    </div>
    <div id="catalog-mount"></div>
    <div id="page-dots"></div>
    <div id="application-menu"></div>
    <div id="layout-actions" hidden></div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <script>
    // Shell side of the WindowCatalog web port. Native state lives in the
    // model; this object only reflects the pager (ring ids + active id pushed
    // from native after each publication) and forwards user input to the
    // exported bridge functions (swipe, page click, viewport, shutdown).
    var AtCatalog = (function() {
      var pageIds = [];
      var activeId = 0;
      var SWIPE_MIN_PX = 60;
      var reportViewport = function() {};
      var shellStrings = [];
      var inputBlocked = true;
      var appearanceMode = 0, softenDark = false;
      var media = [];
      // Published presentation cache only. Commands never change this value;
      // the LOCAL Event must reach the UI mirror before geometry changes.
      var publishedFullscreen = false;

      function applyAppearance() {
        var forced = matchMedia('(forced-colors: active)').matches;
        var dark = appearanceMode === 2 || (appearanceMode === 0 && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.style.colorScheme = forced ? 'light dark' : dark ? 'dark' : 'light';
        root.style.setProperty('--at-background', dark && softenDark && !forced ? '#29323c' : 'Canvas');
        root.style.setProperty('--at-text', dark && softenDark && !forced ? '#e8edf2' : 'CanvasText');
        root.style.color = 'var(--at-text, CanvasText)';
      }

      function el(id) { return document.getElementById(id); }
      function mount() { return el('catalog-mount'); }
      function pageEl(id) {
        return mount().querySelector(
            '.catalog-page[data-window-id="' + id + '"]');
      }
      function bridge(name) {
        var fn = Module['_' + name];
        return typeof fn === 'function' ? fn : null;
      }

      function render() {
        var pages = mount().querySelectorAll('.catalog-page');
        for (var i = 0; i < pages.length; ++i) {
          var on = Number(pages[i].dataset.windowId) === activeId;
          pages[i].classList.toggle('page-active', on);
        }
        var index = pageIds.indexOf(activeId);
        var active = pageEl(activeId);
        el('page-title').textContent = active.dataset.apptraverseWindowTitle;
        el('page-indicator').textContent =
            pageIds.length ? (index + 1) + ' / ' + pageIds.length : '';
        var multi = pageIds.length > 1;
        el('prev-page').disabled = inputBlocked || !multi;
        el('next-page').disabled = inputBlocked || !multi;
        el('app').style.setProperty('--fullscreen-toolbar-height', el('pager-bar').offsetHeight + 'px');

        var dots = el('page-dots');
        dots.textContent = '';
        if (multi) {
          pageIds.forEach(function(id, n) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.setAttribute('aria-label', shellStrings[3] + ' ' + (n + 1));
            dot.disabled = inputBlocked;
            if (id === activeId) dot.setAttribute('aria-current', 'page');
            if (id === activeId) { dot.className = 'dot-active'; }
            dot.addEventListener('click', function() { showPage(id); });
            dots.appendChild(dot);
          });
        }
      }

      function showPage(id) {
        if (inputBlocked) return;
        if (id === activeId) { return; }
        var fn = bridge('ApptraverseWindowCatalogMobilePageShown');
        if (fn) { fn(id >>> 0); }
      }

      function swipe(delta) {
        if (inputBlocked) return;
        var fn = bridge('ApptraverseWindowCatalogMobileSwipe');
        if (fn && pageIds.length > 1) { fn(delta); }
      }

      function shutdown() {
        if (inputBlocked) return;
        var fn = bridge('ApptraverseWindowCatalogRequestShutdown');
        if (fn) { fn(); }
      }

      function requestFullscreen(fullscreen) {
        if (inputBlocked) return;
        bridge('ApptraverseWindowCatalogFullscreen')(activeId, fullscreen ? 1 : 0);
      }

      function installInput() {
        media = ['(prefers-color-scheme: dark)', '(forced-colors: active)'].map(function(q) {
          var m = matchMedia(q); m.addEventListener('change', applyAppearance); return m;
        });
        applyAppearance();
        function persistHiddenPage() {
          // Each accepted lifecycle event must drain the current model. A
          // previous hidden capture cannot cover commands accepted afterward.
          var fn = bridge('ApptraverseWindowCatalogPageHidden');
          if (fn) fn();
        }
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'hidden') persistHiddenPage();
        });
        // Navigation/close can follow an earlier hidden capture.
        window.addEventListener('pagehide', persistHiddenPage);
        el('prev-page').addEventListener('click', function() { swipe(-1); });
        el('next-page').addEventListener('click', function() { swipe(1); });
        el('shutdown-button').addEventListener('click', shutdown);
        el('fullscreen-button').addEventListener('click', function() {
          requestFullscreen(!publishedFullscreen);
        });

        // Swipe: horizontal drag on the page area. Taps still reach list rows
        // and buttons because only drags past the threshold are consumed.
        var startX = 0, startY = 0, tracking = false;
        var m = mount();
        m.addEventListener('touchstart', function(ev) {
          if (ev.touches.length !== 1) { tracking = false; return; }
          startX = ev.touches[0].clientX;
          startY = ev.touches[0].clientY;
          tracking = true;
        }, {passive: true});
        m.addEventListener('touchend', function(ev) {
          if (!tracking) { return; }
          tracking = false;
          var t = ev.changedTouches[0];
          var dx = t.clientX - startX;
          var dy = t.clientY - startY;
          if (Math.abs(dx) >= SWIPE_MIN_PX && Math.abs(dx) > Math.abs(dy)) {
            swipe(dx < 0 ? 1 : -1);
          }
        }, {passive: true});

        // Keyboard paging for desktop browsers.
        document.addEventListener('keydown', function(ev) {
          if (ev.defaultPrevented || ev.isComposing || ev.repeat) return;
          // Escape belongs to an open dialog or native select popup first.
          if (ev.key === 'Escape' && publishedFullscreen &&
              !(ev.target && ev.target.closest('select, dialog, [role="dialog"], [role="menu"]'))) {
            ev.preventDefault(); requestFullscreen(false); return;
          }
          if (ev.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(ev.target.tagName)) { return; }
          if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
          if (ev.key === 'ArrowLeft') { ev.preventDefault(); swipe(-1); }
          if (ev.key === 'ArrowRight') { ev.preventDefault(); swipe(1); }
        });

        // Main client viewport -> model (adaptive chrome layout).
        var report = function() {
          var fn = bridge('ApptraverseWindowCatalogViewportChanged');
          if (!fn) { return; }
          var r = m.getBoundingClientRect();
          var width = Math.round(r.width), height = Math.round(r.height);
          fn(width, height);
          var active = pageEl(activeId);
          if (active && !active.classList.contains('catalog-page-main')) {
            bridge('ApptraverseWindowCatalogChildViewportChanged')(activeId, width, height);
          }
        };
        if (typeof ResizeObserver !== 'undefined') {
          new ResizeObserver(report).observe(m);
          new ResizeObserver(function() {
            el('app').style.setProperty('--fullscreen-toolbar-height', el('pager-bar').offsetHeight + 'px');
          }).observe(el('pager-bar'));
        } else {
          window.addEventListener('resize', report);
        }
        reportViewport = report;
        report();

      }

      return {
        setMenus: function(groups, strings, language) {
          shellStrings = strings;
          document.documentElement.lang = language === 1 ? 'ru' : 'en';
          el('prev-page').setAttribute('aria-label', strings[0]);
          el('next-page').setAttribute('aria-label', strings[1]);
          el('shutdown-button').textContent = strings[2];
          var menu = el('application-menu');
          // Preserve focus and the browser's native popup across publications.
          while (menu.children.length > groups.length) menu.lastChild.remove();
          groups.forEach(function(group, groupIndex) {
            var label = menu.children[groupIndex];
            if (!label) {
              label = document.createElement('label');
              label.appendChild(document.createElement('span'));
              var select = document.createElement('select');
              select.id = 'catalog-menu-' + groupIndex;
              select.addEventListener('change', function() {
                var command = bridge('ApptraverseWindowCatalogMenuCommand');
                if (command && !inputBlocked) command(groupIndex, select.selectedIndex);
              });
              label.appendChild(select); menu.appendChild(label);
            }
            label.firstChild.textContent = group.label.replace(/&/g, '');
            var select = label.lastChild;
            select.disabled = inputBlocked;
            while (select.options.length > group.items.length) select.remove(select.options.length - 1);
            group.items.forEach(function(item, itemIndex) {
              if (!select.options[itemIndex]) select.add(document.createElement('option'));
              var option = select.options[itemIndex];
              option.value = String(itemIndex);
              option.textContent = item.label.replace(/&/g, '');
              option.selected = item.selected;
            });
          });
        },
        setAppearance: function(mode, soften) {
          appearanceMode = mode; softenDark = soften; applyAppearance();
        },
        setStatusKey: function(index) { el('status').textContent = shellStrings[index]; },
        setPages: function(csv, active, fullscreen, fullscreenLabel, layoutItems, mainPage) {
          pageIds = csv ? csv.split(',').map(Number) : [];
          var changed = activeId !== (active >>> 0) || publishedFullscreen !== fullscreen;
          activeId = active >>> 0;
          publishedFullscreen = fullscreen;
          el('app').classList.toggle('page-fullscreen', fullscreen);
          el('fullscreen-button').textContent = fullscreenLabel.replace(/&/g, '');
          el('pager-bar').hidden = false;
          el('fullscreen-button').setAttribute('aria-pressed', String(fullscreen));
          var actions = el('layout-actions');
          actions.hidden = !mainPage;
          while (actions.children.length > layoutItems.length) actions.lastChild.remove();
          layoutItems.forEach(function(item, index) {
            var button = actions.children[index];
            if (!button) {
              button = document.createElement('button'); button.type = 'button';
              button.addEventListener('click', function() {
                if (!inputBlocked) bridge('ApptraverseWindowCatalogLayoutCommand')(index);
              });
              actions.appendChild(button);
            }
            button.textContent = item.label.replace(/&/g, '');
            button.setAttribute('aria-pressed', String(item.selected));
            button.disabled = inputBlocked;
          });
          render();
          if (changed) reportViewport();
        },
        setStatus: function(text) { el('status').textContent = text; },
        setInputBlocked: function(blocked) {
          inputBlocked = blocked;
          mount().inert = blocked;
          el('application-menu').inert = blocked;
          el('layout-actions').inert = blocked;
          el('page-dots').inert = blocked;
          el('application-menu').querySelectorAll('select').forEach(function(select) { select.disabled = blocked; });
          el('page-dots').querySelectorAll('button').forEach(function(dot) { dot.disabled = blocked; });
          ['prev-page', 'next-page', 'shutdown-button', 'fullscreen-button'].forEach(function(id) {
            el(id).disabled = blocked ||
                ((id === 'prev-page' || id === 'next-page') && pageIds.length <= 1);
          });
          el('layout-actions').querySelectorAll('button').forEach(function(button) { button.disabled = blocked; });
        },
        shutdownDone: function(ok) {
          el('app').classList.remove('page-fullscreen');
          publishedFullscreen = false;
          media.forEach(function(m) { m.removeEventListener('change', applyAppearance); });
          media = [];
          el('status').textContent = shellStrings[ok ? 5 : 6];
        },
        installInput: installInput
      };
    })();

    var Module = {
      arguments: ['--state-dir', new URLSearchParams(location.search).get('state-dir') ||
                    '/persistent/window_catalog_web_state'],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      preRun: [function() {
        if (!crossOriginIsolated) {
          throw new Error('crossOriginIsolated is false; serve with COOP/COEP');
        }
        if (typeof SharedArrayBuffer === 'undefined') {
          throw new Error('SharedArrayBuffer unavailable');
        }
      }],
      onRuntimeInitialized: function() {
        AtCatalog.installInput();
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
